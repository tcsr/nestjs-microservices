name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck # whole-project tsc (apps + libs)
      - run: npm run build # rspack build all 5 services
      - run: npm test # unit tests (saga logic, no broker needed)
