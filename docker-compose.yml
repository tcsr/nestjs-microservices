# Local infra for the microservices. Services run on the host (npm run start:all);
# this provides the Kafka broker they talk through.
#   docker compose up -d          # start Kafka (+ UI)
#   npm run start:all             # start all 5 Nest services
services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: msvc_kafka
    ports:
      - '9092:9092' # host apps connect here (advertised as localhost:9092)
    environment:
      # KRaft mode (no ZooKeeper): this node is both controller and broker.
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two data listeners: PLAINTEXT for host apps (localhost:9092), INTERNAL for
      # other containers on the compose network (kafka:9094).
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single-node replication settings.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      # Auto-create topics on first publish (fine for dev; disable in prod and
      # provision topics with explicit partition/replication settings).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  # Web UI to inspect topics/partitions/consumer-groups/messages (great for learning).
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: msvc_kafka_ui
    ports:
      - '8080:8080' # http://localhost:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      - kafka
